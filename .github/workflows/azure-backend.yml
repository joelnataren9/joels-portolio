# Backend CI/CD: test every PR/push that touches backend/, deploy master to Azure App Service.
# Same steps as the manual deploy in DEPLOYMENT.md (zip -> az webapp deploy); Azure installs
# requirements.txt server-side because SCM_DO_BUILD_DURING_DEPLOYMENT=true.
name: Backend CI/CD

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/azure-backend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/azure-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: joels-portfolio
  AZURE_RESOURCE_GROUP: personal_portfolio
  # Match the App Service runtime (PYTHON|3.14) so tests run on what prod runs.
  PYTHON_VERSION: '3.14'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest beautifulsoup4

      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    # Only master deploys; the Azure federated credential is also scoped to refs/heads/master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC login; basic-auth publish profiles are disabled on the app
    concurrency:
      group: backend-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      # Allowlist what ships: no tests, scripts, .env files or service account keys.
      - name: Package backend
        working-directory: backend
        run: zip -r ../backend.zip app requirements.txt startup.sh -x '*__pycache__*' '*.pyc'

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Waits for the Linux app to start (--track-status defaults to true).
      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path backend.zip \
            --type zip

      - name: Smoke test
        run: |
          url="https://${AZURE_WEBAPP_NAME}.azurewebsites.net/health/"
          for attempt in $(seq 1 10); do
            if curl -fsS "$url"; then exit 0; fi
            echo "Attempt $attempt: $url not healthy yet, retrying in 15s"
            sleep 15
          done
          echo "Health check failed: $url" >&2
          exit 1
